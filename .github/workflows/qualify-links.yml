name: Candidate link qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Links (${{ matrix.os }}, ${{ matrix.manager }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        manager: [npm, pnpm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.1"
      - name: Fresh npm resolution
        if: matrix.manager == 'npm'
        shell: bash
        run: |
          rm package-lock.json
          npm install --ignore-scripts
      - name: Fresh isolated pnpm resolution
        if: matrix.manager == 'pnpm'
        shell: bash
        run: |
          npm install --global pnpm@11.21.0 --ignore-scripts
          pnpm install --ignore-scripts --config.node-linker=isolated
      - name: Run complete D1 suite
        run: npm run test:links
      - name: Set up Python for fresh-resolution repository checks
        if: matrix.os == 'ubuntu-latest' && matrix.manager == 'npm'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Ordinary checks with fresh npm resolution
        if: matrix.os == 'ubuntu-latest' && matrix.manager == 'npm'
        run: |
          python -m pip install -r requirements-dev.txt
          pre-commit run --all-files --show-diff-on-failure
      - name: Check fixture contract bytes
        run: git diff --exit-code -- tests/link-validation/contract.json
      - name: Preserve resolved dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolution-${{ matrix.os }}-${{ matrix.manager }}
          path: |
            package-lock.json
            pnpm-lock.yaml
