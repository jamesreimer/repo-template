minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: lint-js
        name: Check JavaScript with ESLint
        language: system
        entry: node node_modules/eslint/bin/eslint.js --max-warnings=0 --
        files: \.(js|cjs|mjs)$
      - id: format-check
        name: Check formatting with Prettier
        language: system
        entry: node node_modules/prettier/bin/prettier.cjs --check --
        files: \.(js|cjs|mjs|json|jsonc|yaml|yml|md)$
        exclude: ^(package-lock\.json|tests/link-validation/contract\.json|tests/fixtures/yaml-stream\.yaml)$
      - id: test-quality-hooks
        name: Test quality hook boundaries
        language: system
        entry: node --test tests/quality-hooks.test.mjs
        always_run: true
        pass_filenames: false
      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        # The adapter accepts filenames only and passes them as literal CLI paths.
        entry: node tools/markdownlint-files.cjs
        types: [markdown]
      - id: test-markdown-rules
        name: Test Markdown authoring rules
        language: system
        entry: node --test tests/markdown-rules.test.cjs
        types: [file]
        always_run: true
        pass_filenames: false
      - id: linkinator
        name: Check local Markdown links
        language: system
        entry: node tools/check-links.mjs
        types: [markdown]
      - id: test-link-validation
        name: Test local link validation
        language: system
        entry: npm run test:links
        always_run: true
        pass_filenames: false

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
