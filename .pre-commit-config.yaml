minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10 # v0.23.3
    hooks:
      - id: markdownlint-cli2
        language_version: "24.18.1"
      - id: markdownlint-cli2
        alias: test-markdown-rules
        name: Test Markdown authoring rules
        entry: node --test tests/markdown-rules.test.cjs
        language_version: "24.18.1"
        types: [file]
        always_run: true
        pass_filenames: false

  - repo: local
    hooks:
      - id: linkinator
        name: Check local Markdown links
        language: system
        entry: node tools/check-links.mjs
        types: [markdown]
      - id: test-link-validation
        name: Test local link validation
        language: system
        entry: npm run test:links
        always_run: true
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # v0.16.8
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
